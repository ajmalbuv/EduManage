[project]
name = "edumanage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "~=3.12"
dependencies = [
    "asgiref==3.8.1",
    "certifi==2024.7.4",
    "cffi==1.16.0",
    "charset-normalizer==3.3.2",
    "cryptography==43.0.0",
    "defusedxml==0.7.1",
    "Django==5.0.7",
    "django-extensions==3.2.3",
    "django-jazzmin==3.0.0",
    "django-templated-mail==1.1.1",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.3.1",
    "djoser==2.2.3",
    "idna==3.7",
    "oauthlib==3.2.2",
    "pycparser==2.22",
    "PyJWT==2.9.0",
    "python-dotenv==1.0.1",
    "python3-openid==3.2.0",
    "requests==2.32.3",
    "requests-oauthlib==2.0.0",
    "social-auth-app-django==5.4.2",
    "social-auth-core==4.5.4",
    "sqlparse==0.5.1",
    "typing_extensions==4.12.2",
    "tzdata==2024.1",
    "urllib3==2.2.2",
]

[tool.ruff]
# Assume Python 3.12
target-version = "py312"

[tool.ruff.lint]
# Enable Django rules (DJ) and other useful ones
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "DJ", # flake8-django
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
# Ensure Django and other third-party imports are separated from local app imports
section-order = [
    "future",
    "standard-library",
    "third-party",
    "django",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
# Group Django imports together
"django" = ["django"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
